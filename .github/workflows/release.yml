name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            bundles: "msi"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"
            bundles: "msi"
          - os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
            bundles: "dmg,app"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            bundles: "deb,rpm,appimage"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""
            bundles: "deb,rpm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        if: matrix.target == 'universal-apple-darwin' || matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          fi
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            rustup target add aarch64-pc-windows-msvc
          fi
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      - name: Install root JS deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Tauri bundle
        run: pnpm tauri build ${{ matrix.args }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.target }}
          path: target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List and prepare artifacts
        run: |
          find dist -type f | sort
          echo "---"

      - name: Compute checksums
        run: |
          cd dist
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.app.tar.gz" \) -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt || true
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/**/*
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}