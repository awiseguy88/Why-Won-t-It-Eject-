name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust format check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check

  core-tests:
    name: Core tests (eject-core)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build core crates
        run: cargo build --locked --manifest-path Cargo.toml -p eject-core -p eject-platform || cargo build --manifest-path Cargo.toml -p eject-core -p eject-platform
      - name: Test core
        run: cargo test --locked --manifest-path Cargo.toml -p eject-core || cargo test --manifest-path Cargo.toml -p eject-core

  clippy:
    name: Clippy (eject-core + eject-platform)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --manifest-path Cargo.toml -p eject-core -p eject-platform --all-targets -- -D warnings || cargo clippy --manifest-path Cargo.toml -p eject-core -p eject-platform --all-targets -- -D warnings

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Typecheck and build
        working-directory: ui
        run: pnpm build

  tauri-check:
    name: Tauri app cargo check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux system deps (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build UI (frontendDist for tauri)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Cargo check (src-tauri)
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml || cargo check --manifest-path src-tauri/Cargo.toml