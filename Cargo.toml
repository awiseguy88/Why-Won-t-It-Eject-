[workspace]
resolver = "2"
members = [
    "crates/eject-core",
    "crates/eject-platform",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/agentwiseai/why-wont-it-eject"
rust-version = "1.77"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
notify-rust = "4"